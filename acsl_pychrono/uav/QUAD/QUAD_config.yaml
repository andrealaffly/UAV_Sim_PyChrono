uav:
  number_of_propellers: 4

  cad:
    chono_scene_file: "Quad.py" # Must match the name of the .py file exported from pychrono in the assets/vehicles folder
    parts:
      ground: "SLDW_GROUND"
      frame:
        name: "Frame"
        color: [0.1, 0.1, 0.1] # For ChColor()
        opacity: 1
      propeller:
        name: ["Propeller-1", "Propeller-2", "Propeller-3", "Propeller-4"]
        color: [[1, 1, 0], [1, 0, 0], [1, 0, 0], [1, 0, 1]] # For ChColor()
        opacity: [1, 1, 1, 1]
      box:
        name: ""
        color: [] # For ChColor()
        opacity: 1

  pixhawk:
    position_local : [0.03, 0.0259, 0] # for chrono vector 
    
  mass:
    mass_total_estimated: 1.05748 # [kg] Get the estimate from Solidworks
    center_of_mass_estimated: [-0.00148, -0.00371, -0.00002] # point where to apply the aerodynamic force in local frame
    inertia_estimated: # Get it from the center of mass of the full assembly
    # (drone frame + box + propellers) espressed in Solidworks coordinate sys (x-front, y-up, z-right), computed at the center of mass
      Lxx : !!float 3761823.15e-9
      Lyy : !!float 6391674.43e-9
      Lzz : !!float 4241605.83e-9
      Lxy : !!float -10891.84e-9
      Lxz : !!float 4088.23e-9
      Lyz : !!float -854.35e-9

  environment:
    air_density: 1.225  # Air density [kg/m^3]
    G_acc: 9.80665      # Gravitational acceleration

  aerodynamics:
    surface_area: 0.06 # Surface area of the drone to account for drag [m^2] (get it from a cross section in Solidworks)
    drag_coefficient: 1.28  # Drag coefficient (equal to that of a plate) [-]

  # FOR NOW, USE HIGH VALUES OF MAX AND MIN THRUST TO AVOID SATURATION (max_thrust = 100N)
  # TO BE UPDATED WITH ACTUAL MOTOR-PROPELLER COMBINATION
  motor:
    # Maximum thrust produced by a single motor = 1355 grams = 1.355 kg = 1.355 kg * 9.81 m/s^2 = 13.28 N
    # Maximum thrust produced by a motors'couple without loss of efficiency due to propeller interaction = 13.28 * 2 = 26.56 N
    # Maximum thrust produced by a motors'couple considering loss of efficiency due to propeller interaction = 26.56 N * 0.8 = 21.25 N
    # For reference see: https://www.getfpv.com/t-motor-pacer-v3-p2306-powerful-freestyle-motor-1750kv-1950kv-2550kv.html
    # self.maximum_motor_thrust = 21.25 # [N] Maximum thrust that can be produced by a motors'couple
    max_thrust: 10.625 # 10.625    # [N] per motor, Maximum thrust that can be produced by a SINGLE motor = 10.625 N
    # Minimum thrust produced by a single motor = 80 grams = 0.08 kg = 0.08 kg * 9.81 m/s^2 = 0.7848 N
    # Minimum thrust produced by a motors'couple without loss of efficiency due to propeller interaction = 0.7848 * 2 = 1.5696 N
    # Minimum thrust produced by a motors'couple considering loss of efficiency due to propeller interaction = 1.5696 N * 0.8 = 1.255 N
    # self.minimum_motor_thrust = 1.255 # [N] Minimum thrust that can be produced by a motors'couple
    min_thrust: 0.6275    # [N] per motor, Minimum thrust that can be produced by a SINGLE motor = 0.6275 N
    
    # Coefficients relaring Thrust, Torque and angular velocity of the propellers
    K_omega: 0.0000014166615 # Coefficent relating the propellers'thrust to the square of the angular velocity. controller.motor_thrusts = K * omega^2
    K_torque: !!float 5e-08 # [5e-08 - 5e-10] TO BE ESTIMATED!!! Coefficent relating the propellers'torque to the square of the angular velocity. Torque = K_torque * omega^2
    
  thrust_realization:  
    mixer_matrix: # (Meassure them in Solidworks)
    # Mixer Matrix for the realization of the thrust generated by each motor (T1, T2, T3, T4) given the control inputs (u1, u2, u3, u4)
      l_x: 0.0969022647597 # distance between centerline of the drone and the motors along x direction in Local NED convention
      l_y: 0.1107151963080 # distance between centerline of the drone and the motors along y direction in Local NED convention
      c_t: 0.01            # drag coefficient of propellers (estimate it by hand, should be around 0.01)
    
    force_positions: # (get them from the coordinate systems of the propellers in Solidworks)
    # position wrt local frame of where to apply the thrust force generated by motors 1 & 5, 2 & 6 , 3 & 7, 4 & 8
    # [x, y, z] local yup
      - [-0.0969022647597, 0.02, -0.1107151963080] # 0
      - [ 0.0969022647597, 0.02, -0.1107151963080] # 1
      - [ 0.0969022647597, 0.02,  0.1107151963080] # 2
      - [-0.0969022647597, 0.02,  0.1107151963080] # 3

    # Motor efficiency coefficients for simulating motor failure
    efficiency_matrix_diag: [1,1,1,1]
    efficiency_matrix_diag_after_failure: [0,1,1,1]
    # Reorder or define coaxial stacking (OPTIONAL)
    # index_map: [2,3,0,1] # if not defined, default is [0,1,2,3,...,n-1]
    # Motors' rotation direction
    # Motor 1: CCW
    # Motor 2: CW
    # Motor 3: CCW
    # Motor 4: CW
    # Define spin direction of each motor: +1 for CCW, -1 for CW
    spin_directions: [1, -1, 1, -1]

controller:
  controller_start_time: 0.0 #0.1
  # These shouldn't change unless you change the mission
  derivative_filter_gains:
    # Roll filters gains (from matlab)
    A_phi_ref: [[-15, -225],[1, 0]]
    B_phi_ref: [[1],[0]]
    C_phi_ref: [225, 0]
    D_phi_ref: 0
    # Pitch filters gains (from matlab)
    A_theta_ref: [[-15, -225],[1, 0]]
    B_theta_ref: [[1],[0]]
    C_theta_ref: [225, 0]
    D_theta_ref: 0
  
  gain_yaml_files:  
    PID: "PID.yaml"
    # MRAC: "MRAC.yaml"
    # MRAC: "MRAC_GA_full.yaml"
    MRAC: "MRAC_GA_diag.yaml"
    # TwoLayerMRAC: "TwoLayerMRAC.yaml"
    TwoLayerMRAC: "TwoLayerMRAC_GA.yaml"
    # FunnelMRAC: "FunnelMRAC.yaml"
    FunnelMRAC: "FunnelMRAC_GA.yaml"
    # HybridMRAC: "HybridMRAC.yaml"
    HybridMRAC: "HybridMRAC_GA.yaml"
    # HybridTwoLayerMRAC: "HybridTwoLayerMRAC.yaml"
    HybridTwoLayerMRAC: "HybridTwoLayerMRAC_GA.yaml"
    # NonAdaptiveEBCI: "NonAdaptiveEBCI.yaml"
    NonAdaptiveEBCI: "NonAdaptiveEBCI_GA.yaml"
    # FunnelTwoLayerMRAC: "FunnelTwoLayerMRAC.yaml"
    FunnelTwoLayerMRAC: "FunnelTwoLayerMRAC_GA.yaml"