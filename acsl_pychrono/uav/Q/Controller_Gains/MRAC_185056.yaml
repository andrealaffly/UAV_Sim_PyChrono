# ----------------------------------------------------------------
#                     Baseline Parameters
# ----------------------------------------------------------------

# **Translational** baseline parameters to let the reference model follow the user-defined model (mu_baseline_tran)
KP_tran:
  scaling_factor: 1
  matrix: [[30, 0, 0],
           [0, 30, 0],
           [0, 0, 60]]

KD_tran:
  scaling_factor: 1
  matrix: [[7.50000000000000, 0, 0],
           [0, 15, 0],
           [0, 0, 37.5000000000000]]

KI_tran:
  scaling_factor: 1
  matrix: [[15, 0, 0],
           [0, 15, 0],
           [0, 0, 5]]

# **Translational** parameters for the PD baseline controller (mu_PD_baseline_tran)
KP_tran_PD_baseline:
  scaling_factor: 1
  matrix: [[77, 0, 0],
           [0, 84, 0],
           [0, 0, 35]]

KD_tran_PD_baseline:
  scaling_factor: 1
  matrix: [[77, 0, 0],
           [0, 84, 0],
           [0, 0, 35]]

# **Rotational** baseline parameters
KP_rot:
  scaling_factor: 1
  matrix: [[168, 0, 0],
           [0, 193, 0],
           [0, 0, 180]]

KI_rot:
  scaling_factor: 1
  matrix: [[113, 0, 0],   
           [0, 112, 0],
           [0, 0, 85]]

# **Rotational** parameters for the PI baseline controller (Moment_baseline_PI)
KP_rot_PI_baseline:
  scaling_factor: 1
  matrix: [[168, 0, 0],
           [0, 193, 0],
           [0, 0, 180]]

KI_rot_PI_baseline:
  scaling_factor: 1
  matrix: [[113, 0, 0],   
           [0, 112, 0],
           [0, 0, 85]]

K_P_omega_ref:
  scaling_factor: !!float 1
  matrix: [[30.4000000000000, 0, 0],
           [0, 30.4000000000000, 0],
           [0, 0, 45.6000000000000]]

K_I_omega_ref:
  scaling_factor: !!float 1
  matrix: [[0.5, 0, 0],
           [0, 0.5, 0],
           [0, 0, 0.1]]

